groups:
  - name: todo-assistant-alerts
    rules:
      - alert: TodoBackendDown
        expr: up{job="todo-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Todo backend is down"
          description: "Prometheus cannot scrape the backend for two minutes."

      - alert: HostHighCPU
        expr: |
          100 * (1 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "Host CPU usage has exceeded 85 percent for ten minutes."
